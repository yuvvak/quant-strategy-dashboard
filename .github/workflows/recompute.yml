name: Recompute backtest

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run engine unit tests (no network required)
        run: cd engine && python -m pytest tests/ -v

      - name: Run backtest
        run: python engine/backtest.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "chore: scheduled backtest recompute $(date -u +%Y-%m-%d)"
            git push
          fi
